name: Deploy Debian repository to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository and LFS files
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify LFS objects
        run: git lfs fsck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
