name: Deploy Debian repository to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository and LFS files
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify LFS objects
        run: git lfs fsck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate directory listings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/web-indexer"
          gh release download 0.9.0 --repo joshbeard/web-indexer \
            --pattern web-indexer_0.9.0_linux_amd64.tar.gz \
            --pattern checksums.txt --dir "$RUNNER_TEMP/web-indexer"
          (
            cd "$RUNNER_TEMP/web-indexer"
            sha256sum --check --ignore-missing checksums.txt
            tar -xzf web-indexer_0.9.0_linux_amd64.tar.gz
          )
          "$RUNNER_TEMP/web-indexer/web-indexer" \
            --source public --target public --recursive --theme default

      - name: Upload public directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
